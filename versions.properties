# The version the NEXT release carries — the single place it is written.
#
# Two readers of one file: build.gradle.kts turns it into the default (-SNAPSHOT) version, and
# the tag-releases workflow turns it into the tag `v<version>` on every push to main, creating
# and publishing it if it does not exist yet. Releasing is: bump this (with angle.pin, if the pin
# moved), commit, push. Nobody types or pushes a tag.
#
# The scheme: 2.1 is ANGLE's own version, the third component the Chromium branch angle.pin takes
# ANGLE from (the build refuses a mismatch), and the fourth is this repository's own: a rebuild of
# the same ANGLE spends it. So 2.1.8078.0 is ANGLE from chromium/8078 as first packaged.
limn-angle-natives=2.1.8078.0
