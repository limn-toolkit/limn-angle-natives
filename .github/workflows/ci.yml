# On every change to what could change the payload: build the four slices, test each one on a
# machine of its own platform and architecture (an OpenGL ES 3.0 context, the extensions the
# toolkit's capability gates need, a draw read back, and on macOS the IOSurface binding), package,
# and rehearse a consumer resolving the jars. Nothing is published.
#
# A branch that is not main runs it by hand (Actions -> ci -> Run workflow), which is how a change
# to the build is tried before main, where a bumped versions.properties is a release.

name: ci

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "patches/**"
      - "src/**"
      - "angle.pin"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "versions.properties"
      - ".github/workflows/ci.yml"
      - ".github/workflows/natives.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "patches/**"
      - "src/**"
      - "angle.pin"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "versions.properties"
      - ".github/workflows/ci.yml"
      - ".github/workflows/natives.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natives:
    uses: ./.github/workflows/natives.yml

  test:
    name: test ${{ matrix.slice }}
    needs: natives
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's Windows runners have no GPU and no OpenGL driver: Direct3D 11 runs on WARP
          # there, which is the machine the toolkit's fallback is for.
          - { slice: windows-x86_64, runs-on: windows-2025, java-arch: x64, distribution: temurin }
          - { slice: windows-aarch64, runs-on: windows-11-arm, java-arch: aarch64, distribution: microsoft }
          - { slice: macos-aarch64, runs-on: macos-latest, java-arch: aarch64, distribution: temurin }
          # The Intel slice on the same Apple Silicon runner, through Rosetta, with an x64 JVM.
          - { slice: macos-x86_64, runs-on: macos-latest, java-arch: x64, distribution: temurin }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: "21"
          architecture: ${{ matrix.java-arch }}

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: angle-native-*
          merge-multiple: true
          path: native/dist

      - name: Test
        shell: bash
        run: ./gradlew test

  package:
    name: package and rehearse a consumer
    needs: [natives, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: angle-native-*
          merge-multiple: true
          path: native/dist

      - name: Show what was produced
        run: ls -lR native/dist

      - name: Rehearse the consumer
        run: bash scripts/rehearse-consumer.sh
